apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-control-plane
  template:
    metadata:
      labels:
        app: agent-control-plane
    spec:
      containers:
        - name: runtime
          image: agent-control-plane:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-control-plane
spec:
  selector:
    app: agent-control-plane
  ports:
    - port: 80
      targetPort: 8080
